<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>hagefugler.no — Interaktiv eske</title><link rel="stylesheet" href="style.css"><style>body{background:transparent}hagefugler-box{max-width:720px;margin:auto}.viewer{max-width:98vw;height:90dvh}</style></head><body><hagefugler-box realisme></hagefugler-box><dialog id="viewer" class="viewer" aria-label="Se nærmere"><button class="close" aria-label="Lukk">✕</button><div class="viewer-layout"><button class="round prev" aria-label="Forrige fugl">←</button><div class="viewer-card"><img id="large-card" alt=""><p id="card-counter" aria-live="polite"></p></div><button class="round next" aria-label="Neste fugl">→</button></div></dialog><script type="module">
import './hagefugler-box.js?v=8';
const box=document.querySelector('hagefugler-box'),dialog=document.querySelector('dialog');let cards=[],current=0;
function show(i){if(!cards.length)return;current=(i+cards.length)%cards.length;document.querySelector('#large-card').src=cards[current].image;document.querySelector('#large-card').alt=cards[current].name;document.querySelector('#card-counter').textContent=`${cards[current].name} · ${current+1} / ${cards.length}`;if(!dialog.open)dialog.showModal()}
box.addEventListener('cards-ready',e=>{cards=e.detail;if(dialog.open)show(current)});box.addEventListener('inspect-card',e=>show(e.detail.index));dialog.querySelector('.close').onclick=()=>dialog.close();dialog.querySelector('.prev').onclick=()=>show(current-1);dialog.querySelector('.next').onclick=()=>show(current+1);dialog.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}});
</script></body></html>
